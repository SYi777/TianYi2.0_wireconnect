[metadata]
name = data_collect
version = 0.1.0
description = Imitation learning data collection
maintainer = SYi777
license = Apache-2.0

[options]
packages = data_collect
install_requires =
    setuptools

[options.entry_points]
console_scripts =
    record_episode = data_collect.record_episode:main
    check_dataset = data_collect.check_dataset:main

[develop]
script_dir = $base/lib/data_collect

[install]
install_scripts = $base/lib/data_collect
