# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - moveit_left_arm_controller
    - moveit_right_arm_controller
    - moveit_left_hand_controller
    - moveit_right_hand_controller
    - moveit_head_controller
    - moveit_trunk_controller

  moveit_left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pitch_l_joint
      - shoulder_roll_l_joint
      - shoulder_yaw_l_joint
      - elbow_pitch_l_joint
      - elbow_yaw_l_joint
      - wrist_pitch_l_joint
      - wrist_roll_l_joint
  moveit_right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pitch_r_joint
      - shoulder_roll_r_joint
      - shoulder_yaw_r_joint
      - elbow_pitch_r_joint
      - elbow_yaw_r_joint
      - wrist_pitch_r_joint
      - wrist_roll_r_joint
  moveit_head_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - head_yaw_joint
      - head_pitch_joint
      - head_roll_joint
  moveit_left_hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_thumb_1_joint
      - left_thumb_2_joint
      - left_index_1_joint
      - left_middle_1_joint
      - left_ring_1_joint
      - left_little_1_joint
  moveit_right_hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_thumb_1_joint
      - right_thumb_2_joint
      - right_index_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_little_1_joint
  moveit_trunk_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - first_leg_pitch_joint
      - second_leg_pitch_joint
      - waist_pitch_joint
      - waist_yaw_joint
