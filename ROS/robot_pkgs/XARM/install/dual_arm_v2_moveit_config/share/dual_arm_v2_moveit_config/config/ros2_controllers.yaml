# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

head_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
      - head_roll_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: false
left_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pitch_l_joint
      - shoulder_roll_l_joint
      - shoulder_yaw_l_joint
      - elbow_pitch_l_joint
      - elbow_yaw_l_joint
      - wrist_pitch_l_joint
      - wrist_roll_l_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: false
right_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pitch_r_joint
      - shoulder_roll_r_joint
      - shoulder_yaw_r_joint
      - elbow_pitch_r_joint
      - elbow_yaw_r_joint
      - wrist_pitch_r_joint
      - wrist_roll_r_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: false
dual_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pitch_l_joint
      - shoulder_roll_l_joint
      - shoulder_yaw_l_joint
      - elbow_pitch_l_joint
      - elbow_yaw_l_joint
      - wrist_pitch_l_joint
      - wrist_roll_l_joint
      - shoulder_pitch_r_joint
      - shoulder_roll_r_joint
      - shoulder_yaw_r_joint
      - elbow_pitch_r_joint
      - elbow_yaw_r_joint
      - wrist_pitch_r_joint
      - wrist_roll_r_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: false
waist_controller:
  ros__parameters:
    joints:
      - waist_yaw_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: false