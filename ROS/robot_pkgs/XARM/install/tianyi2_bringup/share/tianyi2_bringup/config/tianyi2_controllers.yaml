controller_manager:
  ros__parameters:
    update_rate: 250
    cpu_affinity: 8
    thread_priority: 80

    moveit_left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    moveit_right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    moveit_head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    moveit_dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    moveit_trunk_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    moveit_body_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    empty_L_controller:
      type: empty_controller/EmptyController
    empty_R_controller:
      type: empty_controller/EmptyController

    empty_head_controller:
      type: empty_controller/EmptyController
    empty_body_controller:
      type: empty_controller/EmptyController

    jointspace_body_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController

    jointspace_body3joints_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController


    jointspace_waist_pitch_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController

    jointspace_waist_yaw_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController

    jointspace_head_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController

    endpose_head_controller:
      type: head_ik_controller/HeadIkController

    endpose_body_controller:
      type: endpose_body_controller/EndposeBodyController

    jointspace_arm_L_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController
    jointspace_arm_R_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController
    
    jointspace_dual_arm_controller:
      type: jointspace_ruckig_action_controller/JointspaceRuckigActionController

    jointspace_arm_L_collisionfree_controller:
      type: jointspace_ruckig_rmp_controller/JointspaceRuckigRmpController

    jointspace_arm_R_collisionfree_controller:
      type: jointspace_ruckig_rmp_controller/JointspaceRuckigRmpController
      
    jointspace_ruckig_qp_controller:
      type: jointspace_ruckig_qp_controller/JointspaceRuckigQpController

    identify_load_L_controller:
      type: identify_load_L_controller/IdentifyLoadLController

    identify_load_R_controller:
      type: identify_load_R_controller/IdentifyLoadRController

    jointspace_single_arm_qpik_L_controller:
      type: jointspace_qpik_controller/JointspaceQpikController
    jointspace_single_arm_qpik_R_controller:
      type: jointspace_qpik_controller/JointspaceQpikController



    endpose_single_arm_qpik_L_controller:
      type: single_arm_qpik_controller/SingleArmQpikController
    endpose_single_arm_qpik_R_controller:
      type: single_arm_qpik_controller/SingleArmQpikController
    
    wholebody_qpik_controller:
      type: wholebody_qpik_controller/WholebodyQpikController


    endpose_single_arm_qp_L_controller:
      type: single_arm_qp_controller/SingleArmQpController
    endpose_single_arm_qp_R_controller:
      type: single_arm_qp_controller/SingleArmQpController

    endpose_single_arm_qp2_L_controller:
      type: single_arm_qp2_controller/SingleArmQp2Controller
    endpose_single_arm_qp2_R_controller:
      type: single_arm_qp2_controller/SingleArmQp2Controller


    endpose_wholebody_controller:
      type: endpose_wholebody_controller/EndposeWholebodyController
    endpose_dual_arm_qp_controller:
      type: endpose_dual_arm_qp_controller/EndposeDualArmQpController
