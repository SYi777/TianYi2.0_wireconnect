# 底盘的一些相关配置

# 连接底盘服务的ip端口号
chassis_ip : "192.168.11.1"
chassis_port : 1445

# 接收遥控数据的topic名称
sbus_topic_name : "/sbus_data/event"

# 最大移速限制，max_speed大于它2时，会重置为它
speed_limit : 10.0

# 大 中 小 三个移速，这里的移速指的是直线最大前进速度（当手柄方向垂直于水平方向且到达边缘时）
max_speed : 2.0
mid_speed : 0.8
min_speed : 0.5
gear : mid # 提供三个档位 max, mid , min, 分别对应 max_speed, mid_speed, min_speed

angle_coefficient : 0.8

# 右手柄左右控制转向，手
drift_y : 0.05
# 左手柄上下控制前进后退
drift_x : 0.05

