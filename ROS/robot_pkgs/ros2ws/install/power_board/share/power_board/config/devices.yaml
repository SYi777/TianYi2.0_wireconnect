- port: /dev/ttyS1
  baudrate: 115200
  slaves:
    - services:
        - name: powerboard
          type: powerboard
          protocol: 5FF5
        - name: light_square
          type: light_device
          protocol: 5FF5
          effects:
            - 10  # 故障
            - 12  # 告警
            - 313 # 对话-播放
            - 312 # 对话-合成
            - 311 # 对话-推理
            - 310 # 对话-拾音
            - 320 # 对话-弱网
            - 301 # 对话-唤醒
            - 20  # 服务-等待
            - 21  # 服务-启动
            - 23  # 服务-异常
            - 101 # 升级-升级
            - 99  # 系统-待机
