[metadata]
name = xarm_debug
version = 0.1.0
description = XARM debug — topic monitor and controller manager
maintainer = SYi777
license = MIT

[options]
packages = xarm_debug
install_requires =
    setuptools

[options.entry_points]
console_scripts =
    xarmdebug = xarm_debug.xarmdebug:main
    xarmcontroldebug = xarm_debug.xarmcontroldebug:main

[develop]
script_dir = $base/lib/xarm_debug

[install]
install_scripts = $base/lib/xarm_debug
