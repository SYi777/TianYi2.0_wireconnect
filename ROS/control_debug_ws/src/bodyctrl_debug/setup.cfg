[metadata]
name = bodyctrl_debug
version = 0.1.0
description = body_control debug — sensor monitor and motor-level control
maintainer = SYi777
license = MIT

[options]
packages = bodyctrl_debug
install_requires =
    setuptools

[options.entry_points]
console_scripts =
    bodyctrldebug = bodyctrl_debug.bodyctrldebug:main
    headkb = bodyctrl_debug.head_keyboard_control:main

[develop]
script_dir = $base/lib/bodyctrl_debug

[install]
install_scripts = $base/lib/bodyctrl_debug
