<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腕部相机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; height: 100vh; display: flex; }
  body > div { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  body > div:first-child { border-right: 2px solid #222; }
  img { width: 100%; height: 100%; object-fit: contain; }
  .label { position: absolute; top: 6px; left: 10px; font: 13px monospace; color: #0f0; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 3px; z-index: 10; }
</style>
</head>
<body>
<div><span class="label">LEFT :9996</span><img src="/stream/left"></div>
<div><span class="label">RIGHT :9995</span><img src="/stream/right"></div>
</body>
</html>
